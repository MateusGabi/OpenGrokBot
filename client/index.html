<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>OpenGrokBot</title>
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Set the theme before styles load so the first paint never flashes dark.
      var theme = 'light'
      try {
        if (localStorage.getItem('opengrokbot-theme') === 'dark') theme = 'dark'
      } catch (e) {}
      document.documentElement.dataset.theme = theme
      document.querySelector('meta[name="color-scheme"]').content = theme
      document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#fafafa' : '#141414'
      document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content = theme === 'light' ? 'default' : 'black-translucent'
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="/icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").catch(() => {})
    </script>
  </body>
</html>
