<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Offices</title>
  <link rel="stylesheet" href="offices.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Offices sidebar">
      <div class="workspace">
        <span class="workspace-icon">O</span>
        <span class="workspace-name">OpenGrokBot</span>
        <button id="theme" class="icon-button" type="button" title="Toggle theme" aria-label="Toggle theme">◐</button>
      </div>

      <div class="side-section">
        <button id="find" class="side-item" type="button">
          <span class="side-icon">⌕</span><span>Quick find</span><kbd>⌘K</kbd>
        </button>
        <input id="search" class="search-input" type="search" placeholder="Filter offices…" aria-label="Filter offices">
        <button id="new-side" class="side-item" type="button">
          <span class="side-icon">＋</span><span>New office</span>
        </button>
        <form id="new" class="new-form" autocomplete="off" hidden>
          <input id="name" name="name" maxlength="60" placeholder="Office name…" aria-label="New office name" required>
          <button type="submit">Create office</button>
        </form>
      </div>

      <div class="side-label">Private</div>
      <nav id="list" class="office-list" aria-label="Your offices"></nav>

      <div class="side-bottom">
        <button id="add" class="side-item" type="button"><span class="side-icon">↗</span><span>Add existing folder…</span></button>
        <button id="close" class="side-item" type="button"><span class="side-icon">✕</span><span>Close</span><kbd>Esc</kbd></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <span class="crumb">Offices</span><span class="crumb-sep">/</span><span id="crumb-name" class="crumb-current"></span>
      </header>

      <section id="detail" class="page" hidden>
        <div class="page-icon">🏢</div>
        <h1 id="detail-name"></h1>
        <div class="properties">
          <div class="property"><span class="property-key">Status</span><span id="detail-status" class="property-value"></span></div>
          <div class="property"><span class="property-key">Port</span><span id="detail-port" class="property-value mono"></span></div>
          <div class="property"><span class="property-key">Folder</span><span id="detail-dir" class="property-value path"></span></div>
        </div>
        <div class="page-actions">
          <button id="open" class="primary" type="button">Open office</button>
          <button id="rename" class="ghost" type="button">Rename</button>
          <button id="remove" class="ghost danger" type="button">Delete</button>
        </div>
        <p class="tip">Each office has its own team, conversations and workspace folder. Nothing is shared between them.</p>
      </section>

      <section id="empty" class="empty-page">
        <div class="empty-icon">🏢</div>
        <h1>No office selected</h1>
        <p>Choose one in the sidebar, or create a new office with <strong>New office</strong>.</p>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
    </main>
  </div>
  <script src="offices.cjs" defer></script>
</body>
</html>
